<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Python Days 1–12 Study Guide · v2</title>
  <meta name="description" content="Impeccable-style interactive study guide for Angela Yu's 100 Days of Python Days 1–12.">
  <style>

@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

:root {
  color-scheme: light;
  --font-display: 'Fraunces', Georgia, serif;
  --font-body: 'IBM Plex Sans', system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
  --space-1: 0.25rem;
  --space-2: 0.5rem;
  --space-3: 0.75rem;
  --space-4: 1rem;
  --space-5: 1.25rem;
  --space-6: 1.5rem;
  --space-8: 2rem;
  --space-10: 2.5rem;
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --radius-full: 999px;
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --duration: 180ms;
  --canvas: oklch(0.98 0.008 85);
  --surface: oklch(1 0 0);
  --surface-muted: oklch(0.96 0.01 85);
  --text: oklch(0.22 0.02 260);
  --text-muted: oklch(0.48 0.02 260);
  --accent: oklch(0.52 0.14 145);
  --accent-hover: oklch(0.45 0.14 145);
  --accent-soft: oklch(0.92 0.04 145);
  --accent-warm: oklch(0.75 0.12 75);
  --success: oklch(0.48 0.12 145);
  --success-soft: oklch(0.94 0.04 145);
  --warning: oklch(0.72 0.12 75);
  --warning-soft: oklch(0.96 0.04 85);
  --danger: oklch(0.52 0.18 25);
  --danger-soft: oklch(0.96 0.04 25);
  --border: oklch(0.88 0.01 85);
  --code-bg: oklch(0.945 0.012 260);
  --header-bg: oklch(0.99 0.006 85 / 0.92);
  --ring: oklch(0.52 0.14 145 / 0.45);
  --sidebar-width: 272px;
}

[data-theme="dark"] {
  color-scheme: dark;
  --canvas: oklch(0.16 0.015 260);
  --surface: oklch(0.20 0.018 260);
  --surface-muted: oklch(0.24 0.02 260);
  --text: oklch(0.93 0.01 85);
  --text-muted: oklch(0.65 0.02 260);
  --accent: oklch(0.72 0.14 145);
  --accent-hover: oklch(0.78 0.14 145);
  --accent-soft: oklch(0.28 0.04 145);
  --accent-warm: oklch(0.78 0.12 75);
  --success: oklch(0.70 0.12 145);
  --success-soft: oklch(0.26 0.04 145);
  --warning: oklch(0.78 0.12 75);
  --warning-soft: oklch(0.28 0.04 85);
  --danger: oklch(0.65 0.16 25);
  --danger-soft: oklch(0.28 0.06 25);
  --border: oklch(0.30 0.02 260);
  --code-bg: oklch(0.14 0.02 260);
  --header-bg: oklch(0.18 0.015 260 / 0.92);
  --ring: oklch(0.72 0.14 145 / 0.5);
}

*, *::before, *::after { box-sizing: border-box; }

html {
  scroll-behavior: smooth;
  -webkit-font-smoothing: antialiased;
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}

body {
  margin: 0;
  font-family: var(--font-body);
  font-size: 1rem;
  line-height: 1.65;
  background: var(--canvas);
  color: var(--text);
}

a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

:focus { outline: none; }
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* Header */
header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--header-bg);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
  padding: var(--space-3) var(--space-4);
}

.header-inner {
  max-width: 1280px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  gap: var(--space-4);
  flex-wrap: wrap;
}

.brand {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  min-width: 0;
}

.brand-mark {
  width: 36px;
  height: 36px;
  border-radius: var(--radius-md);
  background: var(--accent-soft);
  border: 1px solid var(--border);
  display: grid;
  place-items: center;
  font-family: var(--font-mono);
  font-size: 0.875rem;
  font-weight: 500;
  color: var(--accent);
  flex-shrink: 0;
}

.logo {
  font-family: var(--font-display);
  font-size: 1.125rem;
  font-weight: 600;
  letter-spacing: -0.02em;
  color: var(--text);
  line-height: 1.2;
}

.logo-sub {
  display: block;
  font-family: var(--font-body);
  font-size: 0.6875rem;
  font-weight: 500;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-top: 2px;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  margin-left: auto;
}

.theme-toggle {
  width: 36px;
  height: 36px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface);
  color: var(--text-muted);
  cursor: pointer;
  display: grid;
  place-items: center;
  font-size: 1rem;
  transition: background var(--duration) var(--ease-out), color var(--duration) var(--ease-out);
}
.theme-toggle:hover { background: var(--surface-muted); color: var(--text); }

.progress-bar-wrap {
  flex: 1;
  min-width: 120px;
  max-width: 220px;
}

.progress-label {
  font-size: 0.6875rem;
  font-weight: 500;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: var(--space-1);
}

.progress-bar {
  height: 4px;
  background: var(--surface-muted);
  border-radius: var(--radius-full);
  overflow: hidden;
  border: 1px solid var(--border);
}

.progress-fill {
  height: 100%;
  background: var(--accent);
  border-radius: var(--radius-full);
  transition: width 0.5s var(--ease-out);
  width: 0;
}

.menu-toggle {
  display: none;
  padding: var(--space-2) var(--space-3);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 0.875rem;
  font-weight: 500;
  cursor: pointer;
}

/* Layout */
.layout {
  display: flex;
  max-width: 1280px;
  margin: 0 auto;
  min-height: calc(100vh - 57px);
}

nav.sidebar {
  width: var(--sidebar-width);
  flex-shrink: 0;
  border-right: 1px solid var(--border);
  padding: var(--space-4);
  position: sticky;
  top: 57px;
  height: calc(100vh - 57px);
  overflow-y: auto;
  background: var(--canvas);
}

nav.sidebar h3 {
  font-size: 0.6875rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin: var(--space-5) 0 var(--space-2);
  padding-left: var(--space-2);
}
nav.sidebar h3:first-child { margin-top: 0; }

.nav-link {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-3);
  border-radius: var(--radius-sm);
  color: var(--text-muted);
  font-size: 0.875rem;
  font-weight: 400;
  cursor: pointer;
  border: none;
  background: none;
  width: 100%;
  text-align: left;
  transition: background var(--duration) var(--ease-out), color var(--duration) var(--ease-out);
  border-left: 3px solid transparent;
  margin-bottom: 1px;
}

.nav-link:hover {
  background: var(--surface-muted);
  color: var(--text);
}

.nav-link.active {
  background: var(--accent-soft);
  color: var(--text);
  border-left-color: var(--accent);
  font-weight: 500;
}

.nav-num {
  font-family: var(--font-mono);
  font-size: 0.6875rem;
  color: var(--text-muted);
  min-width: 1.25rem;
}
.nav-link.active .nav-num { color: var(--accent); }

main.content {
  flex: 1;
  padding: var(--space-6) var(--space-8);
  min-width: 0;
  max-width: 900px;
}

/* Hero */
.hero {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: var(--space-8);
  margin-bottom: var(--space-6);
  position: relative;
  overflow: hidden;
}

.hero::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 4px;
  height: 100%;
  background: var(--accent);
}

.hero h1 {
  font-family: var(--font-display);
  font-size: clamp(1.75rem, 4vw, 2.25rem);
  font-weight: 600;
  letter-spacing: -0.03em;
  line-height: 1.2;
  margin: 0 0 var(--space-3);
  color: var(--text);
}

.hero p {
  color: var(--text-muted);
  margin: 0 0 var(--space-4);
  max-width: 52ch;
}

.hero-stats {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-4);
  margin-top: var(--space-5);
  padding-top: var(--space-5);
  border-top: 1px solid var(--border);
}

.stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.stat-value {
  font-family: var(--font-display);
  font-size: 1.5rem;
  font-weight: 600;
  color: var(--accent);
  line-height: 1;
}

.stat-label {
  font-size: 0.75rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

/* Cards */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: var(--space-6);
  margin-bottom: var(--space-4);
}

.card-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--space-3);
  margin-bottom: var(--space-4);
  flex-wrap: wrap;
}

.card h2 {
  font-family: var(--font-display);
  font-size: 1.375rem;
  font-weight: 600;
  letter-spacing: -0.02em;
  margin: 0;
  color: var(--text);
}

.card h3 {
  font-size: 1rem;
  font-weight: 600;
  margin: var(--space-5) 0 var(--space-2);
  color: var(--text);
}

.card h4 {
  font-size: 0.9375rem;
  font-weight: 600;
  margin: var(--space-4) 0 var(--space-2);
}

.section-label {
  font-size: 0.6875rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: var(--space-2);
}

.tag {
  display: inline-block;
  background: var(--surface-muted);
  color: var(--text-muted);
  padding: var(--space-1) var(--space-3);
  border-radius: var(--radius-full);
  font-size: 0.75rem;
  font-weight: 500;
  margin: var(--space-1) var(--space-1) var(--space-1) 0;
  border: 1px solid var(--border);
  transition: border-color var(--duration), color var(--duration);
}
.tag:hover { border-color: var(--accent-warm); color: var(--text); }

ul, ol { padding-left: 1.35rem; margin: var(--space-2) 0; }
li { margin: var(--space-2) 0; }
li::marker { color: var(--accent); }

/* Code */
pre, code { font-family: var(--font-mono); font-feature-settings: 'liga' 0; }

pre {
  background: var(--code-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: var(--space-4);
  overflow-x: auto;
  font-size: 0.8125rem;
  line-height: 1.55;
  margin: var(--space-3) 0;
}

code {
  background: var(--code-bg);
  padding: 0.1em 0.35em;
  border-radius: 4px;
  font-size: 0.875em;
  border: 1px solid var(--border);
}

/* Accordion */
.accordion {
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  margin: var(--space-3) 0;
  overflow: hidden;
  background: var(--surface);
}

.accordion-btn {
  width: 100%;
  text-align: left;
  padding: var(--space-4);
  background: var(--surface-muted);
  border: none;
  color: var(--text);
  cursor: pointer;
  font-family: var(--font-body);
  font-size: 0.9375rem;
  font-weight: 500;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: var(--space-3);
  transition: background var(--duration);
}
.accordion-btn:hover { background: var(--accent-soft); }

.accordion-body {
  display: none;
  padding: var(--space-4);
  border-top: 1px solid var(--border);
}

.accordion.open .accordion-body { display: block; }
.accordion.open .accordion-btn .chev { transform: rotate(180deg); }

.chev {
  color: var(--text-muted);
  font-size: 0.75rem;
  transition: transform var(--duration) var(--ease-out);
}

/* Grid */
.grid-2 {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: var(--space-4);
}

/* Flashcards */
.flashcard-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: var(--space-3);
}

.flashcard {
  perspective: 900px;
  height: 140px;
  cursor: pointer;
}

.flashcard-inner {
  position: relative;
  width: 100%;
  height: 100%;
  transition: transform 0.45s var(--ease-out);
  transform-style: preserve-3d;
}

@media (prefers-reduced-motion: reduce) {
  .flashcard-inner { transition: none; }
  .flashcard.flipped .flashcard-front { display: none; }
  .flashcard.flipped .flashcard-back { transform: none; position: relative; }
}

.flashcard.flipped .flashcard-inner { transform: rotateY(180deg); }

.flashcard-front, .flashcard-back {
  position: absolute;
  width: 100%;
  height: 100%;
  backface-visibility: hidden;
  border-radius: var(--radius-md);
  padding: var(--space-4);
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  border: 1px solid var(--border);
  font-size: 0.875rem;
  line-height: 1.45;
}

.flashcard-front { background: var(--surface-muted); }
.flashcard-back {
  background: var(--accent-soft);
  transform: rotateY(180deg);
  color: var(--text);
}

.flashcard-hint {
  font-size: 0.75rem;
  color: var(--text-muted);
  margin-bottom: var(--space-3);
}

/* Quiz */
.quiz-block {
  border: 1px solid var(--border);
  border-left: 3px solid var(--border);
  border-radius: var(--radius-md);
  padding: var(--space-4);
  margin: var(--space-4) 0;
  background: var(--surface-muted);
}

.quiz-block.correct {
  border-left-color: var(--success);
  background: var(--success-soft);
}

.quiz-block.wrong {
  border-left-color: var(--danger);
  background: var(--danger-soft);
}

.quiz-options {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  margin: var(--space-3) 0;
}

.quiz-options label {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-3) var(--space-4);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 0.9375rem;
  transition: border-color var(--duration), background var(--duration);
}

.quiz-options label:hover { border-color: var(--accent); background: var(--accent-soft); }
.quiz-options input[type="radio"] { accent-color: var(--accent); width: 1rem; height: 1rem; }

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-4);
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-family: var(--font-body);
  font-size: 0.875rem;
  font-weight: 500;
  transition: background var(--duration) var(--ease-out), border-color var(--duration), transform var(--duration);
}

.btn:active { transform: scale(0.98); }

.btn-primary {
  background: var(--accent);
  color: oklch(0.99 0 0);
  border-color: var(--accent);
}
.btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }

.btn-secondary {
  background: var(--surface);
  color: var(--text);
  border-color: var(--border);
}
.btn-secondary:hover { background: var(--surface-muted); }

.btn-success {
  background: var(--success-soft);
  color: var(--success);
  border-color: var(--success);
}
.btn-success:hover { background: var(--accent-soft); }

.btn-sm { padding: var(--space-1) var(--space-3); font-size: 0.8125rem; }

.btn-row { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-3); }

/* Feedback */
.feedback {
  margin-top: var(--space-3);
  padding: var(--space-3) var(--space-4);
  border-radius: var(--radius-sm);
  font-size: 0.875rem;
  line-height: 1.5;
}

.feedback.ok {
  background: var(--success-soft);
  color: var(--success);
  border: 1px solid oklch(from var(--success) l c h / 0.25);
}

.feedback.bad {
  background: var(--danger-soft);
  color: var(--danger);
  border: 1px solid oklch(from var(--danger) l c h / 0.25);
}

/* Inputs */
.fill-blank input,
.quiz-block input[type="text"],
.exam-input {
  padding: var(--space-2) var(--space-3);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 0.9375rem;
  min-width: 140px;
  transition: border-color var(--duration), box-shadow var(--duration);
}

.fill-blank input:focus,
.quiz-block input[type="text"]:focus,
.exam-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--ring);
  outline: none;
}

.exam-input { width: 100%; max-width: 420px; }

/* Drag & drop */
.drag-area {
  min-height: 88px;
  border: 2px dashed var(--border);
  border-radius: var(--radius-md);
  padding: var(--space-3);
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
  align-items: center;
  background: var(--surface);
}

.drag-item, .drop-zone {
  padding: var(--space-2) var(--space-3);
  background: var(--surface-muted);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  cursor: grab;
  user-select: none;
  font-size: 0.8125rem;
  font-weight: 500;
}

.drop-zone {
  min-width: 148px;
  min-height: 44px;
  border-style: dashed;
  border-color: var(--accent);
  background: var(--accent-soft);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: default;
}

.drop-zone.filled { border-style: solid; background: var(--success-soft); }
.match-row { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; margin: var(--space-2) 0; }

/* Badges */
.badge {
  display: inline-flex;
  align-items: center;
  padding: var(--space-1) var(--space-3);
  border-radius: var(--radius-full);
  font-size: 0.6875rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.badge-done {
  background: var(--success-soft);
  color: var(--success);
  border: 1px solid oklch(from var(--success) l c h / 0.3);
}

.badge-todo {
  background: var(--warning-soft);
  color: var(--warning);
  border: 1px solid oklch(from var(--warning) l c h / 0.3);
}

.hidden { display: none !important; }

.section-title {
  font-family: var(--font-display);
  font-size: 1.75rem;
  font-weight: 600;
  letter-spacing: -0.02em;
  margin: 0 0 var(--space-6);
  padding-bottom: var(--space-3);
  border-bottom: 1px solid var(--border);
}

/* Callouts */
.tip-box, .mistake-box, .practice-box {
  padding: var(--space-4);
  border-radius: var(--radius-md);
  margin: var(--space-3) 0;
  border: 1px solid var(--border);
}

.tip-box {
  border-left: 3px solid var(--accent-warm);
  background: var(--warning-soft);
}

.mistake-box {
  border-left: 3px solid var(--danger);
  background: var(--danger-soft);
}

.practice-box {
  border-left: 3px solid var(--success);
  background: var(--success-soft);
}

/* Table */
.table-wrap { overflow-x: auto; margin: var(--space-3) 0; }

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.875rem;
}

th, td {
  border: 1px solid var(--border);
  padding: var(--space-3) var(--space-4);
  text-align: left;
}

th {
  background: var(--surface-muted);
  font-weight: 600;
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-muted);
}

tr:hover td { background: var(--surface-muted); }

/* Exam */
.exam-q {
  margin-bottom: var(--space-6);
  padding-bottom: var(--space-6);
  border-bottom: 1px solid var(--border);
}

.exam-q:last-child { border-bottom: none; }

.exam-type {
  display: inline-block;
  font-family: var(--font-mono);
  font-size: 0.6875rem;
  font-weight: 500;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--accent);
  background: var(--accent-soft);
  padding: 2px 8px;
  border-radius: var(--radius-full);
  margin-right: var(--space-2);
}

/* Study plan */
.study-day {
  border-left: 3px solid var(--accent);
  padding-left: var(--space-4);
}

/* Toast */
.toast {
  position: fixed;
  bottom: var(--space-6);
  right: var(--space-6);
  padding: var(--space-3) var(--space-5);
  background: var(--text);
  color: var(--canvas);
  border-radius: var(--radius-md);
  font-size: 0.875rem;
  font-weight: 500;
  box-shadow: 0 8px 32px oklch(0 0 0 / 0.15);
  z-index: 200;
  opacity: 0;
  transform: translateY(12px);
  transition: opacity 0.3s var(--ease-out), transform 0.3s var(--ease-out);
  pointer-events: none;
}

.toast.show {
  opacity: 1;
  transform: translateY(0);
}

/* Version badge */
.version-pill {
  font-size: 0.625rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 2px 6px;
  border-radius: var(--radius-full);
  background: var(--accent-soft);
  color: var(--accent);
  border: 1px solid var(--border);
  vertical-align: middle;
  margin-left: var(--space-2);
}

/* Responsive */
@media (max-width: 860px) {
  .menu-toggle { display: block; }
  nav.sidebar {
    position: fixed;
    left: calc(-1 * var(--sidebar-width) - 8px);
    top: 57px;
    transition: left 0.3s var(--ease-out);
    z-index: 99;
    box-shadow: 8px 0 32px oklch(0 0 0 / 0.08);
  }
  nav.sidebar.open { left: 0; }
  .layout { display: block; }
  main.content { padding: var(--space-4); max-width: none; }
  .header-actions { margin-left: 0; }
  .progress-bar-wrap { order: 3; width: 100%; max-width: none; }
}

@media (max-width: 480px) {
  .hero { padding: var(--space-5); }
  .card { padding: var(--space-4); }
  .flashcard-grid { grid-template-columns: 1fr; }
}

const STORAGE_KEY = 'pythonStudyGuideProgress';

const THEME_KEY = 'pythonStudyGuideTheme';

function toast(msg) {
  let el = document.getElementById('toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'toast';
    el.className = 'toast';
    el.setAttribute('role', 'status');
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), 2800);
}

function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  localStorage.setItem(THEME_KEY, theme);
  const btn = document.getElementById('themeToggle');
  if (btn) btn.textContent = theme === 'dark' ? '☀' : '☾';
  btn?.setAttribute('aria-label', theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
}

function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme') || 'light';
  applyTheme(cur === 'dark' ? 'light' : 'dark');
}

function countCompletedDays() {
  let n = 0;
  for (let d = 1; d <= 12; d++) if (isComplete('day-' + d)) n++;
  return n;
}


function loadProgress() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
  catch { return {}; }
}
function saveProgress(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}
function markComplete(key) {
  const p = loadProgress();
  p[key] = true;
  saveProgress(p);
  updateProgressBar();
}
function isComplete(key) { return !!loadProgress()[key]; }

function updateProgressBar() {
  const p = loadProgress();
  const total = 12 + 11 + 1;
  let done = 0;
  for (let d = 1; d <= 12; d++) if (p['day-' + d]) done++;
  for (let r of DATA.review) if (p['review-' + r.id]) done++;
  if (p['exam']) done++;
  const pct = Math.round((done / total) * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressLabel').textContent = 'Progress: ' + done + '/' + total + ' (' + pct + '%)';
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function renderCode(code) {
  return '<pre><code>' + esc(code) + '</code></pre>';
}

function accordion(title, body, open) {
  return `<div class="accordion${open ? ' open' : ''}">
    <button class="accordion-btn" onclick="toggleAccordion(this)">${esc(title)}<span class="chev">▼</span></button>
    <div class="accordion-body">${body}</div></div>`;
}

function toggleAccordion(btn) {
  btn.parentElement.classList.toggle('open');
}

function renderFlashcards(cards, id) {
  const inner = cards.map((c, i) => `
    <div class="flashcard" onclick="this.classList.toggle('flipped')" id="${id}-fc-${i}" role="button" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' ')this.click()">
      <div class="flashcard-inner">
        <div class="flashcard-front"><strong>Q</strong> ${esc(c.q)}</div>
        <div class="flashcard-back"><strong>A</strong> ${esc(c.a)}</div>
      </div></div>`).join('');
  return `<p class="flashcard-hint">Click a card to reveal the answer</p><div class="flashcard-grid">${inner}</div>`;
}

function renderPredict(items, id) {
  return items.map((item, i) => `
    <div class="quiz-block" id="${id}-pred-${i}">
      <pre><code>${esc(item.code)}</code></pre>
      <input type="text" class="fill-blank" placeholder="Your prediction" id="${id}-pred-in-${i}">
      <button class="btn btn-primary btn-sm" onclick="checkPredict('${id}',${i},${JSON.stringify(item.answer).replace(/"/g,'&quot;')},${JSON.stringify(item.explain).replace(/"/g,'&quot;')})">Check</button>
      <div id="${id}-pred-fb-${i}"></div></div>`).join('');
}

function checkPredict(prefix, i, answer, explain) {
  const val = document.getElementById(prefix + '-pred-in-' + i).value.trim();
  const fb = document.getElementById(prefix + '-pred-fb-' + i);
  const block = document.getElementById(prefix + '-pred-' + i);
  const ok = val.toLowerCase() === String(answer).toLowerCase();
  block.classList.remove('correct','wrong');
  block.classList.add(ok ? 'correct' : 'wrong');
  fb.className = 'feedback ' + (ok ? 'ok' : 'bad');
  fb.innerHTML = (ok ? '✓ Correct! ' : '✗ Expected: ' + esc(answer) + '. ') + esc(explain);
}

function renderFill(items, id) {
  return items.map((item, i) => `
    <div class="quiz-block" id="${id}-fill-${i}">
      <p>${esc(item.text)}</p>
      <input type="text" id="${id}-fill-in-${i}" placeholder="Answer">
      <button class="btn btn-primary btn-sm" onclick="checkFill('${id}',${i})">Check</button>
      <div id="${id}-fill-fb-${i}"></div></div>`).join('');
}

function checkFill(prefix, i) {
  const item = window._fillData[prefix][i];
  const val = document.getElementById(prefix + '-fill-in-' + i).value.trim().toLowerCase();
  const answers = [item.answer.toLowerCase(), ...(item.alt||[]).map(a=>a.toLowerCase())];
  const ok = answers.includes(val);
  const fb = document.getElementById(prefix + '-fill-fb-' + i);
  const block = document.getElementById(prefix + '-fill-' + i);
  block.classList.toggle('correct', ok);
  block.classList.toggle('wrong', !ok);
  fb.className = 'feedback ' + (ok ? 'ok' : 'bad');
  fb.textContent = ok ? '✓ Correct!' : '✗ Answer: ' + item.answer;
}

function renderMCQ(items, id) {
  return items.map((item, i) => `
    <div class="quiz-block" id="${id}-mcq-${i}">
      <p><strong>${esc(item.q)}</strong></p>
      <div class="quiz-options">${item.options.map((o,j)=>`
        <label><input type="radio" name="${id}-mcq-${i}" value="${j}"> ${esc(o)}</label>`).join('')}
      </div>
      <button class="btn btn-primary btn-sm" onclick="checkMCQ('${id}',${i},${item.answer},${JSON.stringify(item.explain).replace(/"/g,'&quot;')})">Check</button>
      <div id="${id}-mcq-fb-${i}"></div></div>`).join('');
}

function checkMCQ(prefix, i, answer, explain) {
  const sel = document.querySelector(`input[name="${prefix}-mcq-${i}"]:checked`);
  const fb = document.getElementById(prefix + '-mcq-fb-' + i);
  const block = document.getElementById(prefix + '-mcq-' + i);
  if (!sel) { fb.className='feedback bad'; fb.textContent='Select an option.'; return; }
  const ok = parseInt(sel.value) === answer;
  block.classList.toggle('correct', ok);
  block.classList.toggle('wrong', !ok);
  fb.className = 'feedback ' + (ok ? 'ok' : 'bad');
  fb.textContent = (ok ? '✓ Correct! ' : '✗ Incorrect. ') + explain;
}

function renderTF(items, id) {
  return items.map((item, i) => `
    <div class="quiz-block" id="${id}-tf-${i}">
      <p><strong>${esc(item.q)}</strong></p>
      <div class="quiz-options">
        <label><input type="radio" name="${id}-tf-${i}" value="true"> True</label>
        <label><input type="radio" name="${id}-tf-${i}" value="false"> False</label>
      </div>
      <button class="btn btn-primary btn-sm" onclick="checkTF('${id}',${i},${item.answer},${JSON.stringify(item.explain).replace(/"/g,'&quot;')})">Check</button>
      <div id="${id}-tf-fb-${i}"></div></div>`).join('');
}

function checkTF(prefix, i, answer, explain) {
  const sel = document.querySelector(`input[name="${prefix}-tf-${i}"]:checked`);
  const fb = document.getElementById(prefix + '-tf-fb-' + i);
  const block = document.getElementById(prefix + '-tf-' + i);
  if (!sel) { fb.className='feedback bad'; fb.textContent='Select True or False.'; return; }
  const ok = (sel.value === 'true') === answer;
  block.classList.toggle('correct', ok);
  block.classList.toggle('wrong', !ok);
  fb.className = 'feedback ' + (ok ? 'ok' : 'bad');
  fb.textContent = (ok ? '✓ Correct! ' : '✗ Incorrect. ') + explain;
}

function renderMatching(pairs, id) {
  const left = pairs.map((p,i)=>`<div class="drag-item" draggable="true" data-match="${i}" id="${id}-m-${i}">${esc(p[0])}</div>`).join('');
  const right = pairs.map((p,i)=>`
    <div class="match-row">
      <div class="drop-zone" data-accept="${i}" id="${id}-dz-${i}">${esc(p[1])}</div>
      <span id="${id}-match-fb-${i}"></span>
    </div>`).join('');
  return `<p>Drag each term to its matching definition:</p>
    <div class="grid-2"><div class="drag-area" id="${id}-pool">${left}</div><div>${right}</div></div>
    <button class="btn btn-primary btn-sm" onclick="checkMatching('${id}',${JSON.stringify(pairs).replace(/"/g,'&quot;')})">Check Matches</button>`;
}

function initDragDrop() {
  document.querySelectorAll('.drag-item').forEach(el => {
    el.addEventListener('dragstart', e => { e.dataTransfer.setData('text', el.id); });
  });
  document.querySelectorAll('.drop-zone').forEach(zone => {
    zone.addEventListener('dragover', e => e.preventDefault());
    zone.addEventListener('drop', e => {
      e.preventDefault();
      const id = e.dataTransfer.getData('text');
      const item = document.getElementById(id);
      if (item) { zone.innerHTML = ''; zone.appendChild(item); zone.classList.add('filled'); }
    });
  });
}

function checkMatching(id, pairs) {
  pairs.forEach((p, i) => {
    const zone = document.getElementById(id + '-dz-' + i);
    const item = zone.querySelector('.drag-item');
    const fb = document.getElementById(id + '-match-fb-' + i);
    const ok = item && parseInt(item.dataset.match) === i;
    fb.textContent = ok ? '✓' : '✗';
    fb.style.color = ok ? 'var(--success)' : 'var(--danger)';
  });
}

function renderDayTest(test, id) {
  return test.map((item, i) => {
    if (item.type === 'mcq') {
      return `<div class="quiz-block"><p><strong>Q${i+1}:</strong> ${esc(item.q)}</p>
        <div class="quiz-options">${item.options.map((o,j)=>`<label><input type="radio" name="${id}-test-${i}" value="${j}"> ${esc(o)}</label>`).join('')}
        </div><button class="btn btn-sm btn-primary" onclick="checkDayTestMCQ('${id}',${i},${item.answer},${JSON.stringify(item.explain).replace(/"/g,'&quot;')})">Check</button>
        <div id="${id}-test-fb-${i}"></div></div>`;
    }
    if (item.type === 'predict') {
      return `<div class="quiz-block"><p><strong>Q${i+1}:</strong></p><pre><code>${esc(item.q)}</code></pre>
        <input type="text" id="${id}-test-in-${i}"><button class="btn btn-sm btn-primary" onclick="checkDayTestPred('${id}',${i},${JSON.stringify(item.answer).replace(/"/g,'&quot;')},${JSON.stringify(item.explain).replace(/"/g,'&quot;')})">Check</button>
        <div id="${id}-test-fb-${i}"></div></div>`;
    }
    if (item.type === 'tf') {
      return `<div class="quiz-block"><p><strong>Q${i+1}:</strong> ${esc(item.q)}</p>
        <label><input type="radio" name="${id}-test-tf-${i}" value="true"> True</label>
        <label><input type="radio" name="${id}-test-tf-${i}" value="false"> False</label>
        <button class="btn btn-sm btn-primary" onclick="checkDayTestTF('${id}',${i},${item.answer},${JSON.stringify(item.explain).replace(/"/g,'&quot;')})">Check</button>
        <div id="${id}-test-fb-${i}"></div></div>`;
    }
    if (item.type === 'fill') {
      return `<div class="quiz-block"><p><strong>Q${i+1}:</strong> ${esc(item.q)}</p>
        <input type="text" id="${id}-test-in-${i}"><button class="btn btn-sm btn-primary" onclick="checkDayTestPred('${id}',${i},${JSON.stringify(item.answer).replace(/"/g,'&quot;')},${JSON.stringify(item.explain).replace(/"/g,'&quot;')})">Check</button>
        <div id="${id}-test-fb-${i}"></div></div>`;
    }
    return '';
  }).join('');
}

function checkDayTestMCQ(id, i, ans, exp) {
  const sel = document.querySelector(`input[name="${id}-test-${i}"]:checked`);
  const fb = document.getElementById(id + '-test-fb-' + i);
  if (!sel) { fb.className='feedback bad'; fb.textContent='Select an answer.'; return; }
  const ok = parseInt(sel.value) === ans;
  fb.className = 'feedback ' + (ok?'ok':'bad');
  fb.textContent = (ok?'✓ ':'✗ ') + exp;
}

function checkDayTestPred(id, i, ans, exp) {
  const val = document.getElementById(id + '-test-in-' + i).value.trim();
  const ok = val.toLowerCase() === String(ans).toLowerCase();
  const fb = document.getElementById(id + '-test-fb-' + i);
  fb.className = 'feedback ' + (ok?'ok':'bad');
  fb.textContent = (ok?'✓ Correct! ':'✗ Expected: '+ans+'. ') + exp;
}

function checkDayTestTF(id, i, ans, exp) {
  const sel = document.querySelector(`input[name="${id}-test-tf-${i}"]:checked`);
  const fb = document.getElementById(id + '-test-fb-' + i);
  if (!sel) { fb.className='feedback bad'; fb.textContent='Select T/F.'; return; }
  const ok = (sel.value==='true')===ans;
  fb.className = 'feedback ' + (ok?'ok':'bad');
  fb.textContent = (ok?'✓ ':'✗ ') + exp;
}

function renderDay(day) {
  const id = 'day' + day.day;
  window._fillData = window._fillData || {};
  window._fillData[id] = day.fill_blank;
  const topics = day.topics.map(t => `<span class="tag">${esc(t)}</span>`).join('');
  const objs = day.objectives.map(o => `<li>${esc(o)}</li>`).join('');
  const expl = day.explanations.map((e, i) => accordion(e.title, `<p>${esc(e.body)}</p>${renderCode(e.code)}`, i === 0)).join('');
  const beg = day.beginner_examples.map(e => `<h4>${esc(e.title)}</h4>${renderCode(e.code)}`).join('');
  const rw = day.real_world.map(r => `<li>${esc(r)}</li>`).join('');
  const mis = day.mistakes.map(m => `<li>${esc(m)}</li>`).join('');
  const bp = day.best_practices.map(b => `<li>${esc(b)}</li>`).join('');
  const mem = day.memory_tricks.map(m => `<li>${esc(m)}</li>`).join('');
  const take = day.takeaways.map(t => `<li>${esc(t)}</li>`).join('');
  const done = isComplete('day-' + day.day);

  return `<div class="hero">
    <div class="section-label">Day ${day.day} of 12</div>
    <h1>${esc(day.title)}</h1>
    <p>Complete study module with lessons, drills, and an end-of-day test.</p>
    <div style="margin-top:1rem">${topics}</div>
  </div>
  <div class="card">
    <div class="card-header">
      <div><div class="section-label">Goals</div><h2>Learning objectives</h2></div>
      ${done ? '<span class="badge badge-done">Completed</span>' : '<span class="badge badge-todo">In progress</span>'}
    </div>
    <ul>${objs}</ul>
    <div class="btn-row">
      <button class="btn btn-success btn-sm" onclick="markComplete('day-${day.day}');showSection('day-${day.day}');toast('Day ${day.day} marked complete')">Mark day complete</button>
    </div>
  </div>
  <div class="card"><div class="section-label">Learn</div><h2>Detailed explanations</h2>${expl}</div>
  <div class="card"><div class="section-label">Practice</div><h2>Beginner examples</h2>${beg}</div>
  <div class="card"><h2>Real-world examples</h2><ul>${rw}</ul></div>
  <div class="card"><h2>Common mistakes</h2><div class="mistake-box"><ul>${mis}</ul></div></div>
  <div class="card"><h2>Best practices</h2><div class="practice-box"><ul>${bp}</ul></div></div>
  <div class="card"><h2>Memory tricks</h2><div class="tip-box"><ul>${mem}</ul></div></div>
  <div class="card"><h2>Key takeaways</h2><ul>${take}</ul></div>
  <div class="card"><div class="section-label">Recall</div><h2>Flashcards</h2>${renderFlashcards(day.flashcards, id)}</div>
  <div class="card"><div class="section-label">Drill</div><h2>Predict the output</h2>${renderPredict(day.predict, id)}</div>
  <div class="card"><h2>Fill in the blank</h2>${renderFill(day.fill_blank, id)}</div>
  <div class="card"><h2>Multiple choice</h2>${renderMCQ(day.mcq, id)}</div>
  <div class="card"><h2>True or false</h2>${renderTF(day.true_false, id)}</div>
  <div class="card"><h2>Drag & drop matching</h2>${renderMatching(day.matching.pairs, id + '-match')}</div>
  <div class="card"><div class="section-label">Assessment</div><h2>End-of-day test</h2>${renderDayTest(day.day_test, id + '-daytest')}</div>`;
}

function renderHome() {
  const daysDone = countCompletedDays();
  return `<div class="hero">
    <div class="section-label">Angela Yu · 100 Days of Python</div>
    <h1>Days 1–12 Study Guide</h1>
    <p>Master variables through scope in seven focused days. Every lesson, quiz, project, and the 100-question final exam — in one calm, self-contained page.</p>
    <div class="hero-stats">
      <div class="stat"><span class="stat-value">12</span><span class="stat-label">Day modules</span></div>
      <div class="stat"><span class="stat-value">100</span><span class="stat-label">Exam questions</span></div>
      <div class="stat"><span class="stat-value">${daysDone}/12</span><span class="stat-label">Days complete</span></div>
    </div>
  </div>
  <div class="grid-2">
    <div class="card">
      <div class="section-label">Contents</div>
      <h2>What's inside</h2>
      <ul>
        <li>12 day modules — objectives, examples, interactive drills</li>
        <li>11 topic review sheets with code samples</li>
        <li>13 project walkthroughs (Band Name → Blackjack)</li>
        <li>7-day intensive study schedule</li>
        <li>Progress saved automatically in your browser</li>
      </ul>
    </div>
    <div class="card">
      <div class="section-label">Method</div>
      <h2>How to study</h2>
      <ol>
        <li>Work Days 1–12 in order from the sidebar</li>
        <li>Flip flashcards and pass each end-of-day test</li>
        <li>Build projects from the Projects section</li>
        <li>Follow the 7-day plan for exam prep</li>
        <li>Score 80%+ on the final exam</li>
      </ol>
    </div>
  </div>
  <div class="card">
    <div class="section-label">Overview</div>
    <h2>Course progress</h2>
    <div class="table-wrap">
      <table>
        <tr><th>Day</th><th>Topic</th><th>Capstone</th><th>Status</th></tr>
        ${DATA.days.map(d => `<tr>
          <td><span class="nav-num">${String(d.day).padStart(2,'0')}</span></td>
          <td>${esc(d.title)}</td>
          <td>${esc(d.topics[d.topics.length-1])}</td>
          <td>${isComplete('day-'+d.day)?'<span class="badge badge-done">Done</span>':'<span class="badge badge-todo">Todo</span>'}</td>
        </tr>`).join('')}
      </table>
    </div>
  </div>`;
}

function renderReview() {
  return `<h2 class="section-title">Topic Review</h2>` + DATA.review.map(r => {
    const done = isComplete('review-' + r.id);
    return `<div class="card" id="review-${r.id}">
      <h2>${esc(r.title)} ${done?'<span class="badge badge-done">Reviewed</span>':''}</h2>
      <p>${esc(r.summary)}</p>
      <h3>Key Points</h3><ul>${r.key_points.map(k=>`<li>${esc(k)}</li>`).join('')}</ul>
      ${renderCode(r.code)}
      <button class="btn btn-success btn-sm" onclick="markComplete('review-${r.id}')">Mark Reviewed</button>
    </div>`;
  }).join('');
}

function renderProjects() {
  return `<h2 class="section-title">Project Breakdowns</h2>` + DATA.projects.map(p => `
    <div class="card">
      <h2>${esc(p.name)} <span class="tag">Day ${p.day}</span></h2>
      <p><strong>Concepts:</strong> ${p.concepts.map(c=>`<span class="tag">${esc(c)}</span>`).join('')}</p>
      <h3>Steps</h3><ol>${p.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>
      <div class="tip-box"><strong>Extension:</strong> ${esc(p.extension)}</div>
    </div>`).join('');
}

function renderStudyPlan() {
  const sp = DATA.studyPlan;
  const days = sp.days.map(d => `
    <div class="study-day card">
      <h3>Calendar Day ${d.day}: ${esc(d.focus)}</h3>
      <h4>Schedule</h4><ul>${d.schedule.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>
      <h4>Memorization Targets</h4><ul>${d.memorize.map(m=>`<li>${esc(m)}</li>`).join('')}</ul>
      <h4>Practice Goals</h4><ul>${d.practice.map(p=>`<li>${esc(p)}</li>`).join('')}</ul>
      <p><em>Spaced repetition:</em> ${esc(d.repeat)}</p>
    </div>`).join('');
  return `<h2 class="section-title">${esc(sp.title)}</h2>
    <div class="card"><p>${esc(sp.overview)}</p>
    <h3>Spaced Repetition Strategy</h3><ul>${sp.spaced_repetition.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>
    <h3>Overall Goals</h3><ul>${sp.goals.map(g=>`<li>${esc(g)}</li>`).join('')}</ul></div>${days}`;
}

function renderExam() {
  const saved = loadProgress().examAnswers || {};
  const questions = DATA.exam.map((q, i) => {
    let body = `<div class="exam-q" id="exam-q-${i}">
      <p><strong>Q${i+1}.</strong> <span class="exam-type">${q.type}</span> ${esc(q.q).split(String.fromCharCode(10)).join('<br>')}</p>`;
    if (q.type === 'mcq') {
      body += `<div class="quiz-options">${q.options.map((o,j)=>`
        <label><input type="radio" name="exam-${i}" value="${j}" ${saved[i]===String(j)?'checked':''}> ${esc(o)}</label>`).join('')}</div>`;
    } else if (q.type === 'tf') {
      body += `<div class="quiz-options">
        <label><input type="radio" name="exam-${i}" value="true" ${saved[i]==='true'?'checked':''}> True</label>
        <label><input type="radio" name="exam-${i}" value="false" ${saved[i]==='false'?'checked':''}> False</label>
      </div>`;
    } else {
      body += `<input type="text" class="exam-input" id="exam-in-${i}" value="${esc(saved[i]||'')}" placeholder="Your answer">`;
    }
    body += `<div id="exam-fb-${i}"></div></div>`;
    return body;
  }).join('');

  return `<h2 class="section-title">Final exam</h2>
    <div class="card">
      <p>100 questions covering Days 1–12. Save progress anytime; aim for 80% to pass.</p>
      <div class="btn-row">
        <button class="btn btn-primary" onclick="saveExamProgress()">Save progress</button>
        <button class="btn btn-success" onclick="submitExam()">Submit & grade</button>
        <button class="btn btn-secondary" onclick="showExamKey()">Answer key</button>
      </div>
      <div id="exam-score"></div>
    </div>
    <div class="card">${questions}</div>
    <div class="card hidden" id="exam-key">
      <h2>Answer key</h2>
      ${DATA.exam.map((q,i)=>{
        let ans = q.type==='mcq' ? q.options[q.answer] : q.type==='tf' ? (q.answer?'True':'False') : q.answer;
        return `<p><strong>Q${i+1}:</strong> ${esc(String(ans))} — ${esc(q.explain)}</p>`;
      }).join('')}
    </div>`;
}

function saveExamProgress() {
  const answers = {};
  DATA.exam.forEach((q, i) => {
    if (q.type === 'mcq' || q.type === 'tf') {
      const sel = document.querySelector(`input[name="exam-${i}"]:checked`);
      if (sel) answers[i] = sel.value;
    } else {
      const inp = document.getElementById('exam-in-' + i);
      if (inp && inp.value) answers[i] = inp.value;
    }
  });
  const p = loadProgress();
  p.examAnswers = answers;
  saveProgress(p);
  toast('Exam progress saved');
}

function submitExam() {
  saveExamProgress();
  let score = 0;
  DATA.exam.forEach((q, i) => {
    const fb = document.getElementById('exam-fb-' + i);
    let ok = false;
    if (q.type === 'mcq') {
      const sel = document.querySelector(`input[name="exam-${i}"]:checked`);
      ok = sel && parseInt(sel.value) === q.answer;
    } else if (q.type === 'tf') {
      const sel = document.querySelector(`input[name="exam-${i}"]:checked`);
      ok = sel && (sel.value === 'true') === q.answer;
    } else {
      const inp = document.getElementById('exam-in-' + i);
      ok = inp && inp.value.trim().toLowerCase() === String(q.answer).toLowerCase();
    }
    if (ok) score++;
    if (fb) {
      fb.className = 'feedback ' + (ok?'ok':'bad');
      fb.textContent = ok ? '✓ Correct' : '✗ ' + q.explain;
    }
  });
  const pct = Math.round((score/100)*100);
  document.getElementById('exam-score').innerHTML = `<div class="feedback ${pct>=80?'ok':'bad'}" style="margin-top:1rem;font-size:1.2rem">
    Score: ${score}/100 (${pct}%) ${pct>=80?'— Great job! 🎉':'— Review weak areas and retry.'}</div>`;
  if (pct >= 80) markComplete('exam');
}

function showExamKey() {
  document.getElementById('exam-key').classList.toggle('hidden');
}

function showSection(id) {
  document.querySelectorAll('.nav-link').forEach(l => l.classList.toggle('active', l.dataset.section === id));
  const main = document.getElementById('main-content');
  if (id === 'home') main.innerHTML = renderHome();
  else if (id === 'review') main.innerHTML = renderReview();
  else if (id === 'projects') main.innerHTML = renderProjects();
  else if (id === 'study-plan') main.innerHTML = renderStudyPlan();
  else if (id === 'exam') main.innerHTML = renderExam();
  else if (id.startsWith('day-')) {
    const n = parseInt(id.split('-')[1]);
    const day = DATA.days.find(d => d.day === n);
    if (day) main.innerHTML = renderDay(day);
    initDragDrop();
  }
  if (id !== 'home') window.scrollTo(0, 0);
  updateProgressBar();
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}

function init() {
  applyTheme(localStorage.getItem(THEME_KEY) || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  showSection('home');
  updateProgressBar();
}
document.addEventListener('DOMContentLoaded', init);

function toggleSidebar(force) {
  const sb = document.getElementById('sidebar');
  if (force === false) { sb.classList.remove('open'); return; }
  sb.classList.toggle('open');
}
  </script>
</body>
</html>
